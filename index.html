<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM服务器群组</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6C63FF;--accent:#FF6584;--bg:#0D0D2B;--text:#E8E8F0;--dim:#9999BB}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text)}
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.25;animation:float 20s ease-in-out infinite alternate;pointer-events:none;z-index:0}
.orb1{width:600px;height:600px;background:var(--primary);top:-20%;left:-10%}
.orb2{width:500px;height:500px;background:var(--accent);bottom:-20%;right:-10%;animation-delay:-8s}
@keyframes float{0%{transform:translate(0,0)}100%{transform:translate(80px,-60px)}}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:rgba(13,13,43,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-size:1.4rem;font-weight:800;color:#fff;text-decoration:none}
.logo span{color:var(--primary)}
.logo .tag{font-size:.7rem;font-weight:400;color:var(--dim);margin-left:8px}
.main{position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px}
.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;line-height:1.2;margin-bottom:4px;animation:fadeUp .8s ease both}
.hero .sub{font-size:1.1rem;color:var(--dim);margin-bottom:12px;animation:fadeUp .8s ease .05s both}
.hero .sub span{color:var(--primary);font-weight:600}
.hero .info{font-size:.92rem;color:var(--dim);line-height:1.8;margin-bottom:32px;animation:fadeUp .8s ease .1s both}
.hero .info .copy-item{display:inline-block;cursor:pointer;padding:2px 8px;border-radius:6px;transition:all .2s;position:relative}
.hero .info .copy-item:hover{background:rgba(108,99,255,.2);color:#fff}
.hero .info .copy-item:active{transform:scale(.95)}
.hero .info .hl{color:#00D4FF}
.hero .info .copy-tip{font-size:.65rem;color:var(--dim);margin-left:4px;opacity:0;transition:opacity .3s}
.hero .info .copy-item:hover .copy-tip{opacity:.7}
.hero .info .copied-msg{display:inline-block;font-size:.7rem;color:#00C896;margin-left:6px;opacity:0;transition:opacity .3s;pointer-events:none}
.hero .info .copied-msg.show{opacity:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.footer{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--dim);font-size:.85rem}
.footer .copy-qq{cursor:pointer;transition:color .2s}
.footer .copy-qq:hover{color:var(--primary)}
@media(max-width:768px){.nav{padding:14px 20px}}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav class="nav">
  <a href="#" class="logo">QM<span>服务器群组</span><span class="tag">· 村庄农家乐</span></a>
</nav>

<div class="main">
  <div class="hero">
    <h1>🏡 村庄农家乐</h1>
    <p class="sub"><span>QM服务器群组</span> · 旗下服务器</p>
    <p class="info">
      <span class="copy-item" onclick="copyText('202604042011A.aternos.me', this)">
        <span class="hl">IP</span> 202604042011A.aternos.me
        <span class="copy-tip">📋 点击复制</span>
        <span class="copied-msg">✅ 已复制</span>
      </span>
      <br>
      <span class="copy-item" onclick="copyText('61838', this)">
        <span class="hl">端口</span> 61838
        <span class="copy-tip">📋 点击复制</span>
        <span class="copied-msg">✅ 已复制</span>
      </span>
      &nbsp;·&nbsp;
      <span class="copy-item" onclick="copyText('1.21.11', this)">
        <span class="hl">版本</span> 1.21.11
        <span class="copy-tip">📋 点击复制</span>
        <span class="copied-msg">✅ 已复制</span>
      </span>
    </p>
  </div>
  <div class="footer">
    <p>© 2026 QM服务器群组 · 村庄农家乐 · QQ群 <span class="copy-qq" onclick="copyText('644272205', this)">644272205</span> <span style="font-size:.7rem;color:var(--dim);cursor:pointer" onclick="copyText('644272205', this)">📋</span></p>
  </div>
</div>

<script>
function copyText(text, el) {
  // 复制到剪贴板
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopied(el);
    }).catch(() => {
      fallbackCopy(text, el);
    });
  } else {
    fallbackCopy(text, el);
  }
}

function fallbackCopy(text, el) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showCopied(el);
  } catch (e) {
    alert('复制失败，请手动复制：' + text);
  }
  document.body.removeChild(textarea);
}

function showCopied(el) {
  // 找到当前元素内的 .copied-msg
  const msg = el.querySelector('.copied-msg');
  if (msg) {
    msg.classList.add('show');
    setTimeout(() => {
      msg.classList.remove('show');
    }, 2000);
  } else {
    // 如果 el 是 QQ 群那样的纯文本节点，用另一种方式
    const parent = el.closest ? el.closest('.copy-qq') : null;
    if (parent) {
      const tip = parent.nextElementSibling;
      if (tip && tip.textContent.includes('📋')) {
        tip.textContent = '✅ 已复制';
        setTimeout(() => {
          tip.textContent = '📋';
        }, 2000);
      }
    }
  }
}
</script>
</body>
</html>
