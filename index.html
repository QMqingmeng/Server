<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM服务器群组</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none!important;-moz-user-select:none!important;user-select:none!important}
:root{--primary:#6C63FF;--accent:#FF6584;--bg:#0D0D2B;--card:rgba(255,255,255,.05);--text:#E8E8F0;--dim:#9999BB}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text)}
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.25;animation:float 20s ease-in-out infinite alternate;pointer-events:none;z-index:0}
.orb1{width:600px;height:600px;background:var(--primary);top:-20%;left:-10%}
.orb2{width:500px;height:500px;background:var(--accent);bottom:-20%;right:-10%;animation-delay:-8s}
@keyframes float{0%{transform:translate(0,0)}100%{transform:translate(80px,-60px)}}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:rgba(13,13,43,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-size:1.4rem;font-weight:800;color:#fff;text-decoration:none}
.logo span{color:var(--primary)}
.logo .tag{font-size:.7rem;font-weight:400;color:var(--dim);margin-left:8px}
.btn-nav{padding:8px 20px;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;border:none;transition:all .25s}
.btn-login{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.15)}
.btn-login:hover{border-color:var(--primary);color:#fff}
.btn-reg{background:var(--primary);color:#fff;margin-left:8px}
.btn-reg:hover{background:#5A52D5}
.main{position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 24px}
.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;line-height:1.2;margin-bottom:4px;animation:fadeUp .8s ease both}
.hero .sub{font-size:1.1rem;color:var(--dim);margin-bottom:12px;animation:fadeUp .8s ease .05s both}
.hero .sub span{color:var(--primary);font-weight:600}
.hero .info{font-size:.92rem;color:var(--dim);line-height:1.8;margin-bottom:32px;animation:fadeUp .8s ease .1s both}
.hero .info .hl{color:#00D4FF}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s ease .2s both}
.btn-primary{padding:14px 32px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;border:none;color:#fff;background:linear-gradient(135deg,var(--primary),#8B83FF);box-shadow:0 4px 20px rgba(108,99,255,.4);transition:all .3s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(108,99,255,.55)}
.btn-secondary{padding:14px 32px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.12);color:var(--text);background:rgba(255,255,255,.04);transition:all .3s}
.btn-secondary:hover{border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.footer{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--dim);font-size:.85rem}
.modal-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:all .35s}
.modal-overlay.active{opacity:1;visibility:visible}
.modal{background:#13133A;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:40px 36px;width:100%;max-width:420px;transform:translateY(20px) scale(.96);transition:all .35s;box-shadow:0 40px 80px rgba(0,0,0,.5);position:relative}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--dim);cursor:pointer;font-size:1rem}
.modal-close:hover{border-color:var(--accent);color:var(--accent)}
.modal h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.modal .sub{color:var(--dim);font-size:.88rem;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.84rem;font-weight:600;color:var(--dim);margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border-radius:10px;font-size:.95rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;outline:none}
.form-group input:focus{border-color:var(--primary);background:rgba(108,99,255,.06)}
.form-group input::placeholder{color:rgba(153,153,187,.4)}
.form-group .err{color:var(--accent);font-size:.78rem;margin-top:4px;display:none}
.form-group.invalid input{border-color:var(--accent)}
.form-group.invalid .err{display:block}
.pwd-strength-wrap{margin-top:6px;width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.pwd-strength-bar{height:100%;width:0%;border-radius:4px;transition:width .2s ease,background .2s ease}
.pwd-strength-text{display:block;font-size:.75rem;margin-top:4px;color:var(--dim);text-align:right;min-height:1.2em}
.btn-submit{width:100%;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;border:none;color:#fff;background:linear-gradient(135deg,var(--primary),#8B83FF);box-shadow:0 4px 16px rgba(108,99,255,.3);transition:all .3s;margin-top:4px}
.btn-submit:hover{transform:translateY(-2px)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:.88rem;font-weight:500;color:#fff;animation:toastIn .3s ease both;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;word-break:break-all}
.toast.ok{background:#00C896}.toast.err{background:#FF6584}.toast.info{background:var(--primary)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:768px){.nav{padding:14px 20px}.modal{margin:16px;padding:28px 20px}}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<nav class="nav">
  <a href="#" class="logo">QM<span>服务器群组</span><span class="tag">· 村庄农家乐</span></a>
  <div>
    <button class="btn-nav btn-login" onclick="openModal('login')" id="navLoginBtn">登录</button>
    <button class="btn-nav btn-reg" onclick="openModal('register')" id="navRegBtn">注册</button>
    <button class="btn-nav btn-login" onclick="handleLogout()" id="navLogoutBtn" style="display:none;border-color:var(--accent);color:var(--accent)">退出</button>
  </div>
</nav>

<div class="main">
  <div class="hero">
    <h1>🏡 村庄农家乐</h1>
    <p class="sub"><span>QM服务器群组</span> · 旗下服务器</p>
    <p class="info">
      <span class="hl">IP</span> 202604042011A.aternos.me : 61838 &nbsp;·&nbsp; <span class="hl">版本</span> 1.21.11
    </p>
    <div class="hero-btns">
      <button class="btn-primary" onclick="openModal('register')" id="heroJoinBtn">立即加入</button>
      <button class="btn-secondary" onclick="showToast('QQ群: 644272205', 'info')">QQ群号</button>
    </div>
  </div>
  <div class="footer">
    <p>© 2026 QM服务器群组 · 村庄农家乐 · QQ群 644272205</p>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('login')">✕</button>
    <h2>欢迎回来</h2>
    <p class="sub">登录你的账号</p>
    <form onsubmit="handleLogin(event)">
      <div class="form-group" id="loginEmailGroup">
        <label>邮箱</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
        <div class="err">请输入有效邮箱</div>
      </div>
      <div class="form-group" id="loginPwdGroup">
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="输入密码">
        <div class="err">密码不能为空</div>
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">登 录</button>
    </form>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('register')">✕</button>
    <h2>创建账号</h2>
    <p class="sub">加入我们的大家庭</p>
    <form onsubmit="handleRegister(event)">
      <div class="form-group" id="regNameGroup">
        <label>用户名</label>
        <input type="text" id="regName" placeholder="设置昵称">
        <div class="err">用户名至少2个字符</div>
      </div>
      <div class="form-group" id="regEmailGroup">
        <label>邮箱</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
        <div class="err">请输入有效邮箱</div>
      </div>
      <div class="form-group" id="regPwdGroup">
        <label>密码</label>
        <input type="password" id="regPwd" placeholder="至少8位，含大小写字母">
        <div class="pwd-strength-wrap">
          <div class="pwd-strength-bar" id="strengthBar"></div>
        </div>
        <span class="pwd-strength-text" id="strengthText">请输入密码</span>
        <div class="err">密码至少8位，且包含大小写字母</div>
      </div>
      <div class="form-group" id="regConfirmGroup">
        <label>确认密码</label>
        <input type="password" id="regConfirm" placeholder="再次输入密码">
        <div class="err">两次密码不一致</div>
      </div>
      <button type="submit" class="btn-submit" id="regBtn">注 册</button>
    </form>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// ============================================================
// Supabase 配置
// ============================================================
const SUPABASE_URL = 'https://kchfeeaanhppzimitvei.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Nvvf9CapS_GAcTRXjwt2Yw_hai7JlTb';

// ============================================================
// 弹窗控制
// ============================================================
function openModal(type) {
  document.getElementById(type + 'Modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(type) {
  document.getElementById(type + 'Modal').classList.remove('active');
  document.body.style.overflow = '';
}
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) {
      closeModal('login');
      closeModal('register');
    }
  });
});

function setError(id, on) {
  document.getElementById(id).classList.toggle('invalid', on);
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'success' ? 'ok' : type === 'error' ? 'err' : 'info');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

// ============================================================
// 密码强度
// ============================================================
const pwdInput = document.getElementById('regPwd');
const strengthBar = document.getElementById('strengthBar');
const strengthText = document.getElementById('strengthText');

function checkPwdStrength(pwd) {
  const hasMinLen = pwd.length >= 8;
  const hasUpper = /[A-Z]/.test(pwd);
  const hasLower = /[a-z]/.test(pwd);
  const hasDigit = /\d/.test(pwd);
  const hasSpecial = /[^A-Za-z0-9]/.test(pwd);
  let score = 0;
  if (hasMinLen) score++;
  if (hasUpper && hasLower) score++;
  if (hasDigit) score++;
  if (hasSpecial) score++;
  return { score, isValid: hasMinLen && hasUpper && hasLower };
}

function updateStrength() {
  const pwd = pwdInput.value;
  const result = checkPwdStrength(pwd);
  const bar = strengthBar;
  const text = strengthText;

  if (pwd.length === 0) {
    bar.style.width = '0%';
    bar.style.background = '#9999BB';
    text.textContent = '请输入密码';
    text.style.color = '#9999BB';
    document.getElementById('regPwdGroup').classList.remove('invalid');
    return;
  }

  const pct = (result.score / 4) * 100;
  let color, label;
  if (result.score <= 1) { color = '#FF6584'; label = '弱'; }
  else if (result.score === 2) { color = '#FFC857'; label = '中'; }
  else if (result.score === 3) { color = '#00C896'; label = '强'; }
  else { color = '#00C896'; label = '极强'; }

  bar.style.width = pct + '%';
  bar.style.background = color;
  text.textContent = label;
  text.style.color = color;

  const group = document.getElementById('regPwdGroup');
  if (!result.isValid) group.classList.add('invalid');
  else group.classList.remove('invalid');
}

pwdInput.addEventListener('input', updateStrength);

// ============================================================
// 登录状态
// ============================================================
function updateUIForUser(user) {
  if (user) {
    document.getElementById('navLoginBtn').style.display = 'none';
    document.getElementById('navRegBtn').style.display = 'none';
    document.getElementById('navLogoutBtn').style.display = 'inline-block';
    document.getElementById('heroJoinBtn').textContent = '👋 ' + user.username;
    document.getElementById('heroJoinBtn').onclick = function() {
      showToast('已登录: ' + user.username, 'info');
    };
  } else {
    document.getElementById('navLoginBtn').style.display = 'inline-block';
    document.getElementById('navRegBtn').style.display = 'inline-block';
    document.getElementById('navLogoutBtn').style.display = 'none';
    document.getElementById('heroJoinBtn').textContent = '立即加入';
    document.getElementById('heroJoinBtn').onclick = function() {
      openModal('register');
    };
  }
}

function checkAutoLogin() {
  const token = localStorage.getItem('qm_token');
  if (token) {
    try {
      const user = JSON.parse(atob(token.split('.')[1]));
      if (user.exp && user.exp > Date.now()) {
        updateUIForUser(user);
        return user;
      }
    } catch {}
    localStorage.removeItem('qm_token');
  }
  updateUIForUser(null);
  return null;
}

function handleLogout() {
  localStorage.removeItem('qm_token');
  updateUIForUser(null);
  showToast('已退出登录', 'info');
}

// ============================================================
// 调用 Supabase API
// ============================================================
async function supabaseRequest(method, path, body) {
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  };
  const options = { method, headers };
  if (body) options.body = JSON.stringify(body);
  const res = await fetch(url, options);
  return res;
}

// ============================================================
// 注册
// ============================================================
async function handleRegister(e) {
  e.preventDefault();

  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pwd = document.getElementById('regPwd').value;
  const confirm = document.getElementById('regConfirm').value;

  let ok = true;
  if (name.length < 2) { setError('regNameGroup', true); ok = false; }
  else setError('regNameGroup', false);

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('regEmailGroup', true); ok = false; }
  else setError('regEmailGroup', false);

  const pwdResult = checkPwdStrength(pwd);
  if (!pwdResult.isValid) { setError('regPwdGroup', true); ok = false; }
  else setError('regPwdGroup', false);

  if (pwd !== confirm) { setError('regConfirmGroup', true); ok = false; }
  else setError('regConfirmGroup', false);

  if (!ok) return;

  const btn = document.getElementById('regBtn');
  btn.disabled = true;
  btn.textContent = '注册中...';

  try {
    // 检查邮箱是否已被注册
    const checkRes = await supabaseRequest('GET', 'users?email=eq.' + encodeURIComponent(email));
    const existing = await checkRes.json();
    if (existing.length > 0) {
      throw new Error('该邮箱已被注册');
    }

    // 注册新用户
    const res = await supabaseRequest('POST', 'users', {
      username: name,
      email: email,
      password: pwd
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || '注册失败');
    }

    // 生成 Token
    const tokenData = { username: name, email: email, exp: Date.now() + 7 * 24 * 60 * 60 * 1000 };
    const token = 'token.' + btoa(JSON.stringify(tokenData)) + '.sig';
    localStorage.setItem('qm_token', token);

    closeModal('register');
    showToast('✅ 注册成功！欢迎 ' + name, 'success');
    checkAutoLogin();

  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '注 册';
  }
}

// ============================================================
// 登录
// ============================================================
async function handleLogin(e) {
  e.preventDefault();

  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pwd = document.getElementById('loginPwd').value;

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setError('loginEmailGroup', true);
    return;
  }
  setError('loginEmailGroup', false);

  if (!pwd) {
    setError('loginPwdGroup', true);
    return;
  }
  setError('loginPwdGroup', false);

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await supabaseRequest('GET', 'users?email=eq.' + encodeURIComponent(email));
    const users = await res.json();

    if (!res.ok) {
      throw new Error('查询用户失败');
    }

    if (users.length === 0) {
      throw new Error('用户不存在');
    }

    const user = users[0];
    if (user.password !== pwd) {
      throw new Error('密码错误');
    }

    const tokenData = { username: user.username, email: user.email, exp: Date.now() + 7 * 24 * 60 * 60 * 1000 };
    const token = 'token.' + btoa(JSON.stringify(tokenData)) + '.sig';
    localStorage.setItem('qm_token', token);

    closeModal('login');
    showToast('✅ 登录成功！欢迎 ' + user.username, 'success');
    checkAutoLogin();

  } catch (err) {
    showToast('❌ ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

// ============================================================
// 自动登录
// ============================================================
checkAutoLogin();
</script>
</body>
</html>
